name: Deploy to GitHub Packages

on:
  push:
    branches:
      - main      # Releases and snapshots from main
      - '**'      # Snapshots from any branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version from gradle.properties
        id: version
        run: |
          VERSION=$(grep "^version" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

          # Determine if snapshot or release
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
            echo "build_type=Snapshot" >> $GITHUB_OUTPUT
            echo "📦 Building SNAPSHOT version $VERSION"
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
            echo "build_type=Release" >> $GITHUB_OUTPUT

            # Only deploy releases from main branch
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "::error::Release versions can only be deployed from main branch"
              echo "::error::Current branch: ${{ github.ref }}"
              echo "::error::Version: $VERSION (release)"
              echo "::notice::To deploy this version, either:"
              echo "::notice::  1. Push to main branch, OR"
              echo "::notice::  2. Change version to include -SNAPSHOT suffix"
              exit 1
            fi
            echo "🚀 Building RELEASE version $VERSION"
          fi

      - name: Build project
        run: |
          echo "Building Quilt mod with Gradle..."
          ./gradlew clean build --no-daemon --stacktrace
          echo "✓ Build completed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          echo "Running tests..."
          ./gradlew test --no-daemon
          echo "✓ Tests passed"
        continue-on-error: false

      - name: Publish to GitHub Packages
        run: |
          echo "Publishing to GitHub Packages..."
          echo "Repository: https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Type: ${{ steps.version.outputs.build_type }}"

          ./gradlew publish --no-daemon --stacktrace

          echo "✓ Publication completed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lunarcore-quilt-${{ steps.version.outputs.version }}
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
          retention-days: 30

      - name: Report deployment failure
        if: failure()
        run: |
          echo "::error::═══════════════════════════════════════════════════════════"
          echo "::error::  DEPLOYMENT FAILED"
          echo "::error::═══════════════════════════════════════════════════════════"
          echo "::error::Version: ${{ steps.version.outputs.version }}"
          echo "::error::Type: ${{ steps.version.outputs.build_type }}"
          echo "::error::Branch: ${{ github.ref }}"
          echo "::error::Repository: https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven"
          echo "::error::"
          echo "::error::Possible causes:"
          echo "::error::  - Build or test failures (check logs above)"
          echo "::error::  - Version already exists (releases cannot be overwritten)"
          echo "::error::  - GitHub token permissions issue"
          echo "::error::  - Dependency resolution problems"
          echo "::error::"
          echo "::error::Check the Gradle build logs above for detailed error messages"
          exit 1

      - name: Create deployment summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🚀 Deployment Successful!

          **Version:** `${{ steps.version.outputs.version }}`
          **Type:** ${{ steps.version.outputs.build_type }}
          **Repository:** `https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven`
          **Branch:** `${{ github.ref_name }}`
          **Commit:** `${{ github.sha }}`

          ### 📦 Using This Package

          #### Gradle

          ```gradle
          repositories {
              maven {
                  name = "GitHubPackages"
                  url = uri("https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven")
                  credentials {
                      username = project.findProperty("gpr.user") ?: System.getenv("USERNAME")
                      password = project.findProperty("gpr.token") ?: System.getenv("TOKEN")
                  }
              }
          }

          dependencies {
              modImplementation "dev.lunarbit.lunarcore:lunarcore-quilt:${{ steps.version.outputs.version }}"
          }
          ```

          #### Maven

          ```xml
          <repositories>
            <repository>
              <id>github</id>
              <url>https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven</url>
            </repository>
          </repositories>

          <dependencies>
            <dependency>
              <groupId>dev.lunarbit.lunarcore</groupId>
              <artifactId>lunarcore-quilt</artifactId>
              <version>${{ steps.version.outputs.version }}</version>
            </dependency>
          </dependencies>
          ```

          ### 🔐 Authentication

          **Gradle:** Add to `~/.gradle/gradle.properties`:
          ```properties
          gpr.user=YOUR_GITHUB_USERNAME
          gpr.token=YOUR_PERSONAL_ACCESS_TOKEN
          ```

          **Maven:** Add to `~/.m2/settings.xml`:
          ```xml
          <servers>
            <server>
              <id>github</id>
              <username>YOUR_GITHUB_USERNAME</username>
              <password>YOUR_PERSONAL_ACCESS_TOKEN</password>
            </server>
          </servers>
          ```

          ### 📊 Deployment Info

          - **Workflow:** ${{ github.workflow }}
          - **Run ID:** ${{ github.run_id }}
          - **Actor:** @${{ github.actor }}
          - **Build Tool:** Gradle with Quilt Loom
          - **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          EOF

