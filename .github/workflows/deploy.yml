name: Deploy to GitHub Packages

on:
  push:
    branches:
      - main      # Releases and snapshots from main
      - '**'      # Snapshots from any branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Extract version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout 2>/dev/null | tail -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

          # Determine if snapshot or release
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "is_snapshot=true" >> $GITHUB_OUTPUT
            echo "build_type=Snapshot" >> $GITHUB_OUTPUT
            echo "📦 Building SNAPSHOT version $VERSION"
          else
            echo "is_snapshot=false" >> $GITHUB_OUTPUT
            echo "build_type=Release" >> $GITHUB_OUTPUT

            # Only deploy releases from main branch
            if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "::error::Release versions can only be deployed from main branch"
              echo "::error::Current branch: ${{ github.ref }}"
              echo "::error::Version: $VERSION (release)"
              echo "::notice::To deploy this version, either:"
              echo "::notice::  1. Push to main branch, OR"
              echo "::notice::  2. Change version to include -SNAPSHOT suffix"
              exit 1
            fi
            echo "🚀 Building RELEASE version $VERSION"
          fi

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "✓ Maven settings.xml configured"

      - name: Build project
        run: |
          echo "Building project..."
          mvn clean package -B -V
          echo "✓ Build completed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: |
          echo "Running tests..."
          mvn test -B
          echo "✓ Tests passed"
        continue-on-error: false

      - name: Deploy to GitHub Packages
        run: |
          echo "Deploying to GitHub Packages..."
          echo "Repository: https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Type: ${{ steps.version.outputs.build_type }}"

          mvn deploy -B -DskipTests

          echo "✓ Deployment completed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-${{ steps.version.outputs.version }}
          path: |
            target/*.jar
            target/*.pom
            !target/*-sources.jar
            !target/*-javadoc.jar
          retention-days: 30

      - name: Report deployment failure
        if: failure()
        run: |
          echo "::error::═══════════════════════════════════════════════════════════"
          echo "::error::  DEPLOYMENT FAILED"
          echo "::error::═══════════════════════════════════════════════════════════"
          echo "::error::Version: ${{ steps.version.outputs.version }}"
          echo "::error::Type: ${{ steps.version.outputs.build_type }}"
          echo "::error::Branch: ${{ github.ref }}"
          echo "::error::Repository: https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven"
          echo "::error::"
          echo "::error::Possible causes:"
          echo "::error::  - Build or test failures"
          echo "::error::  - Version already exists (releases cannot be overwritten)"
          echo "::error::  - GitHub token permissions issue"
          echo "::error::  - Network connectivity issues"
          echo "::error::"
          echo "::error::Check the logs above for detailed error messages"
          exit 1

      - name: Create deployment summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 🚀 Deployment Successful!

          **Version:** `${{ steps.version.outputs.version }}`
          **Type:** ${{ steps.version.outputs.build_type }}
          **Repository:** `https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven`
          **Branch:** `${{ github.ref_name }}`
          **Commit:** `${{ github.sha }}`

          ### 📦 Using This Package

          Add to your `pom.xml`:

          ```xml
          <repositories>
            <repository>
              <id>github</id>
              <url>https://maven.pkg.github.com/Lunarbit-dev/lunarcore-maven</url>
            </repository>
          </repositories>

          <dependencies>
            <dependency>
              <groupId>dev.lunarbit.lunarcore</groupId>
              <artifactId>lunarcore-quilt</artifactId>
              <version>${{ steps.version.outputs.version }}</version>
            </dependency>
          </dependencies>
          ```

          ### 🔐 Authentication

          Add to your `~/.m2/settings.xml`:

          ```xml
          <servers>
            <server>
              <id>github</id>
              <username>YOUR_GITHUB_USERNAME</username>
              <password>YOUR_PERSONAL_ACCESS_TOKEN</password>
            </server>
          </servers>
          ```

          ### 📊 Deployment Info

          - **Workflow:** ${{ github.workflow }}
          - **Run ID:** ${{ github.run_id }}
          - **Actor:** @${{ github.actor }}
          - **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          EOF

